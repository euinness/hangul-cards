<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>한글 카드</title>
  <!-- 아이폰·아이패드 홈 화면에 추가하면 앱처럼 열리게 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="한글 카드">
  <meta name="theme-color" content="#FFF8E7">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- 아이에게 친근한 둥근 글꼴 (인터넷이 없으면 기본 글꼴로 보여요) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" data-tab="consonant">

    <!-- 위쪽: 탭 3개 -->
    <nav class="tabs">
      <button class="tab active" data-tab="consonant">자음</button>
      <button class="tab" data-tab="vowel">모음</button>
      <button class="tab" data-tab="merge">합치기</button>
      <button class="tab" data-tab="family">기타</button>
    </nav>

    <!-- 가운데: 카드 -->
    <main class="stage">

      <!-- 자음·모음 카드 (누르면 뒤집힘) -->
      <button id="flipCard" class="card" aria-label="카드 뒤집기">
        <div class="card-inner">
          <div class="face front">
            <span id="bigLetter" class="big-letter">ㄱ</span>
            <span class="hint">눌러 보세요 👆</span>
          </div>
          <div class="face back">
            <span id="backEmoji" class="emoji">🎒</span>
            <span id="backName" class="letter-name">기역</span>
            <span id="backWord" class="word">가방</span>
            <span id="backNote" class="note"></span>
          </div>
        </div>
      </button>

      <!-- 합치기 카드 (누르면 ㄱ + ㅏ → 가) -->
      <button id="mergeCard" class="card merge" aria-label="글자 합치기" hidden>
        <div class="merge-letters">
          <span id="mergeC" class="piece c">ㄱ</span>
          <span class="piece plus">+</span>
          <span id="mergeV" class="piece v">ㅏ</span>
          <span id="mergeResult" class="piece result">가</span>
        </div>
        <div class="merge-word">
          <span id="mergeEmoji" class="emoji">🎒</span>
          <span id="mergeWord" class="word">가방</span>
          <span id="mergeNote" class="note"></span>
        </div>
        <span class="hint">눌러서 합쳐 보세요 👆</span>
      </button>

      <!-- 따라 쓰기 결과 (정답! / 다시 한번 해볼까요?) -->
      <div id="typeResult" class="type-result" aria-live="polite"></div>
    </main>

    <!-- 따라 쓰기 칸: 누르면 휴대폰 키보드가 열려요 -->
    <form id="typeForm" class="type-row" autocomplete="off">
      <input id="typeInput" type="text" lang="ko" placeholder="낱말을 따라 써 보세요"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <button type="submit" class="type-btn">확인</button>
    </form>

    <!-- 몇 번째 카드인지 -->
    <div class="counter-row">
      <p id="counter" class="counter">1 / 14</p>
      <!-- 가족 카드 설정 버튼 ([기타] 탭에서만 보여요) -->
      <button id="settingsBtn" class="settings-btn" aria-label="기타 카드 설정" hidden>⚙️</button>
    </div>

    <!-- 아래쪽: 이전 / 다음 버튼 -->
    <div class="nav-buttons">
      <button id="prevBtn" class="nav-btn">◀ 이전</button>
      <button id="nextBtn" class="nav-btn">다음 ▶</button>
    </div>

  </div>

  <!-- 가족 카드 설정 화면 (사진과 낱말은 이 기기 안에만 저장돼요) -->
  <div id="settings" class="settings" hidden>
    <div class="settings-panel">
      <h2>기타 카드 설정</h2>
      <p class="settings-help">각 카드의 <b>＋ 사진</b>을 눌러 사진이나 그림을 넣으면 이모지 대신 보여요.</p>
      <p class="settings-help">🔒 사진과 낱말은 <b>이 기기 안에만</b> 저장돼요. 인터넷에 올라가지 않아요.</p>
      <p id="storageWarning" class="warning" hidden>⚠️ 이 브라우저에서는 저장이 안 돼요. 홈 화면에 추가한 아이콘으로 열어 주세요.</p>

      <div id="familyList" class="family-list"></div>

      <form id="addForm" class="add-form">
        <input id="newWord" type="text" placeholder="새 낱말 (예: 이모)" maxlength="8" autocomplete="off">
        <button type="submit" class="small-btn">추가</button>
      </form>

      <button id="settingsDone" class="done-btn">완료</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
